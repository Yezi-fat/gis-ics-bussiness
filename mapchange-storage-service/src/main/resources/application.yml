server:
  port: 8084

spring:
  application:
    name: storage-service
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_ADDR:nacos:8848}
        fail-fast: false          # 注册中心未就绪不阻断启动（T-04），Nacos 客户端后台重试注册
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  jackson:
    property-naming-strategy: SNAKE_CASE   # 统一响应包 snake_case（评审 R-10②）
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 500MB

storage:
  provider: ${STORAGE_PROVIDER:auto}      # oss / obs / local / auto（auto 探测装配，FR-4.4）
  local:
    dir: ${STORAGE_LOCAL_DIR:/data/mapchange}   # local 模式卷挂载目录（必须持久化挂载）
    replicas-check: ${EXPECTED_REPLICAS:1}       # local 模式副本数 > 1 拒绝启动
    # 签名 URL base：public 供前端（经 gateway）；internal 供 Python 拉取（评审 P-03）——
    # Python 宿主机部署时 internal 须指向宿主机可达地址（如 http://localhost:8084 配合端口映射）
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080}
    internal-base-url: ${STORAGE_INTERNAL_BASE_URL:http://storage-service:8084}
  oss:
    endpoint: ${OSS_ENDPOINT:}            # 完整 URL（约束 #10）
  obs:
    endpoint: ${OBS_ENDPOINT:}            # 完整 URL（约束 #10）

security:
  auth:
    enabled: ${AUTH_ENABLED:true}
  internal-token: ${INTERNAL_TOKEN:dev-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
